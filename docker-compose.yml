services:
  # MySQL Database
  mysql:
    image: mysql:8
    container_name: mysql_db
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=n8n
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - target: 3306
        published: ${N8N_MYSQL_PORT:-0}
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # phpMyAdmin for Database Management
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_ui
    ports:
      - target: 80
        published: ${N8N_PHPMYADMIN_PORT:-0}
        host_ip: 127.0.0.1
        protocol: tcp
    environment:
      - PMA_HOST=mysql
      - PMA_USER=root
      - PMA_PASSWORD=root
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # n8n Workflow Automation
  n8n:
    build:
      context: .
      dockerfile: n8n.Dockerfile
    container_name: n8n_app
    ports:
      - target: 5678
        published: ${N8N_APP_PORT:-0}
        host_ip: 127.0.0.1
        protocol: tcp
    environment:
      - DB_TYPE=mysqldb
      - DB_MYSQLDB_HOST=mysql
      - DB_MYSQLDB_PORT=3306
      - DB_MYSQLDB_DATABASE=n8n_internal
      - DB_MYSQLDB_USER=root
      - DB_MYSQLDB_PASSWORD=root
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - N8N_DISABLE_EXTERNAL_MODULES=false
      - N8N_DEFAULT_TIMEOUT=180000
      - N8N_TASK_RUNNER_TIMEOUT=180000
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_app
    ports:
      - target: 8080
        published: ${N8N_BACKEND_PORT:-0}
        host_ip: 127.0.0.1
        protocol: tcp
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=n8n
      - DB_ARCHIVE_NAME=n8n_archive
      - DB_USER=root
      - DB_PASSWORD=root
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # Angular Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_app
    ports:
      - target: 80
        published: ${N8N_FRONTEND_PORT:-0}
        host_ip: 127.0.0.1
        protocol: tcp
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
  n8n_data:
