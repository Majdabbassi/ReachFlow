# ========================
# APPLICATION
# ========================
spring.application.name=reachflow-backend
server.port=8080

# ========================
# DATABASE (MySQL)
# ========================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:reachflow}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.archive.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_ARCHIVE_NAME:reachflow_archive}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.archive.username=${DB_USER:root}
spring.datasource.archive.password=${DB_PASSWORD:root}
spring.datasource.archive.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.archive.hibernate.ddl-auto=update
spring.jpa.archive.database-platform=org.hibernate.dialect.MySQLDialect

# ========================
# LOGGING
# ========================
logging.level.com.majd.reachflow=INFO
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR

# ========================
# SECURITY (local tool: no auth by design)
# ========================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8088,http://localhost:4200}
# AES key for stored Gmail app passwords (the dev default logs a warning at start-up)
encryption.key=${ENCRYPTION_KEY:my-secret-key-123}

# ========================
# MAIL (campaign delivery)
# ========================
mail.smtp.host=${SMTP_HOST:smtp.gmail.com}
mail.smtp.port=${SMTP_PORT:465}
mail.smtp.secure=${SMTP_SECURE:true}

# Demo mode: when set, lead collection calls this URL instead of the webhook sent by the UI.
demo.webhook-url=${DEMO_WEBHOOK_URL:}
# Demo mode: create a client, attachments and sample leads on first start.
demo.seed=${DEMO_SEED:false}

# ========================
# FILE UPLOAD
# ========================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
