<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #drawer class="sidenav" fixedInViewport
      [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
      [mode]="(isHandset$ | async) ? 'over' : 'side'"
      [opened]="(isHandset$ | async) === false">
    
    <div class="brand">
      <div class="logo">
        <mat-icon color="primary">rocket_launch</mat-icon>
      </div>
      <span class="brand-name">ReachFlow</span>
    </div>

    <mat-nav-list class="nav-list">
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}" (click)="closeSidenav(drawer)">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/clients" routerLinkActive="active-link" (click)="closeSidenav(drawer)">
        <mat-icon matListItemIcon>group</mat-icon>
        <span matListItemTitle>Clients</span>
      </a>
      <a mat-list-item routerLink="/leads" routerLinkActive="active-link" (click)="closeSidenav(drawer)">
        <mat-icon matListItemIcon>hub</mat-icon>
        <span matListItemTitle>Leads</span>
      </a>
      <a mat-list-item routerLink="/leads/email-audit" routerLinkActive="active-link" (click)="closeSidenav(drawer)">
        <mat-icon matListItemIcon>mark_email_unread</mat-icon>
        <span matListItemTitle>Email Audit</span>
      </a>
      <a mat-list-item routerLink="/campaigns" routerLinkActive="active-link" (click)="closeSidenav(drawer)">
        <mat-icon matListItemIcon>auto_graph</mat-icon>
        <span matListItemTitle>Campaigns</span>
      </a>
      <a mat-list-item routerLink="/categories" routerLinkActive="active-link" (click)="closeSidenav(drawer)">
        <mat-icon matListItemIcon>category</mat-icon>
        <span matListItemTitle>Categories</span>
      </a>
      <a mat-list-item routerLink="/archive" routerLinkActive="active-link" (click)="closeSidenav(drawer)">
        <mat-icon matListItemIcon>inventory_2</mat-icon>
        <span matListItemTitle>Archive</span>
      </a>
      
      <div class="nav-divider"></div>
      
    </mat-nav-list>

    <div class="nav-footer">
      <div class="user-profile">
        <div class="avatar">{{ user.initials }}</div>
        <div class="user-info">
          <span class="name">{{ user.name }}</span>
          <span class="role">{{ user.role }}</span>
        </div>
      </div>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    <mat-progress-bar mode="indeterminate" *ngIf="loading$ | async" class="global-progress"></mat-progress-bar>
    <mat-toolbar class="glass-header">
      <button mat-icon-button (click)="drawer.toggle()" class="menu-btn">
        <mat-icon>menu_open</mat-icon>
      </button>
      <span class="page-title">Workspace</span>
      <span class="spacer"></span>
      <button mat-icon-button class="header-icon">
        <mat-icon matBadge="3" matBadgeColor="accent">notifications</mat-icon>
      </button>
      <button mat-icon-button class="header-icon">
        <mat-icon>help_outline</mat-icon>
      </button>
    </mat-toolbar>

    <div class="page-container" [@routeAnimations]="prepareRoute(outlet)">
      <router-outlet #outlet="outlet"></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
