<div class="container">
  <h2>Settings</h2>
  <mat-card>
    <mat-card-header>
      <mat-card-title>n8n Configuration</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="settingsForm" (ngSubmit)="saveSettings()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>n8n Webhook URL</mat-label>
          <input matInput formControlName="webhookUrl" placeholder="https://n8n.your-domain.com/webhook/...">
          <mat-hint>The endpoint where outreach batches will be sent.</mat-hint>
        </mat-form-field>
        <div class="actions">
          <button mat-raised-button color="primary" type="submit" [disabled]="settingsForm.invalid">
            <mat-icon>save</mat-icon> Save Settings
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
